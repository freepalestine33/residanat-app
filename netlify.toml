[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/sync/pull"
  to = "/.netlify/functions/sync-pull"
  status = 200

[[redirects]]
  from = "/api/sync/push"
  to = "/.netlify/functions/sync-push"
  status = 200

[[redirects]]
  from = "/api/ai/generate-lecture"
  to = "/.netlify/functions/ai-generate-lecture"
  status = 200

[[redirects]]
  from = "/api/webhooks/n8n-lecture"
  to = "/.netlify/functions/n8n-lecture"
  status = 200

[[redirects]]
  from = "/api/lectures"
  to = "/.netlify/functions/lectures"
  status = 200

[[redirects]]
  from = "/api/lectures/:id"
  to = "/.netlify/functions/lecture-by-id?id=:id"
  status = 200

[[redirects]]
  from = "/api/notes"
  to = "/.netlify/functions/notes"
  status = 200
